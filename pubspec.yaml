name: arena
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  share_plus: ^7.2.1
  equatable: ^2.0.7
  flutter_svg: ^2.2.3
  http: ^1.2.0
  intl: ^0.19.0
  go_router: ^17.2.2
  fl_chart: ^1.2.0
  shared_preferences: ^2.5.5
  syncfusion_flutter_datepicker: ^33.2.4
  connectivity_plus: ^7.1.1
  flutter_secure_storage: ^10.3.0
  dio: ^5.9.2
  path_provider: ^2.1.5
  qr_flutter: ^4.1.0
  flutter_thermal_printer: ^2.0.1
  pdfx: ^2.9.2
  esc_pos_utils_plus: ^2.0.4
  image: ^4.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/brand/
    - assets/icons/
    - assets/icons/inboxIndicator/
    - assets/icons/profile/
    - assets/icons/drawer/

  fonts:
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans/DMSans_18pt-Regular.ttf
          weight: 400
        - asset: assets/fonts/DMSans/DMSans_18pt-Medium.ttf
          weight: 500
        - asset: assets/fonts/DMSans/DMSans_18pt-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/DMSans/DMSans_18pt-Bold.ttf
          weight: 700
        - asset: assets/fonts/DMSans/DMSans_18pt-ExtraBold.ttf
          weight: 800
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/jetbrainsMono/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/jetbrainsMono/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/jetbrainsMono/JetBrainsMono-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/jetbrainsMono/JetBrainsMono-Bold.ttf
          weight: 700
        - asset: assets/fonts/jetbrainsMono/JetBrainsMono-ExtraBold.ttf
          weight: 800
